{% extends "core/base.html" %}
{% load i18n %}
{% block content %}
<div class="card" style="max-width: 420px; margin: 30px auto;">
  <h2>{% trans "Sign in" %}</h2>
  <form method="post">
    {% csrf_token %}
    {% if form.errors %}<p class="errorlist">{% trans "Invalid username or password." %}</p>{% endif %}
    <div class="form-row">
      <label>{% trans "Username" %}</label>
      <input type="text" name="username" required autofocus>
    </div>
    <div class="form-row">
      <label>{% trans "Password" %}</label>
      <input type="password" name="password" required>
    </div>
    <button class="btn" type="submit" style="width:100%;">{% trans "Sign in" %}</button>
  </form>
  {% url 'signup' as signup_url %}
  <p class="small muted" style="margin-top: 12px;">{% blocktrans %}No account? <a href="{{ signup_url }}">Create one</a>.{% endblocktrans %}</p>
</div>
{% endblock %}
