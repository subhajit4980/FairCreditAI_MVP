{% extends "core/base.html" %}
{% block content %}
<div class="card" style="max-width: 520px; margin: 30px auto;">
  <h2>Create your FairCreditScore account</h2>
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <div class="form-row">
        <label>{{ field.label }}</label>
        {{ field }}
        {% if field.help_text %}<span class="helptext">{{ field.help_text }}</span>{% endif %}
        {{ field.errors }}
      </div>
    {% endfor %}
    <button class="btn" type="submit" style="width:100%;">Create account</button>
  </form>
  <p class="small muted" style="margin-top: 12px;">Already have an account? <a href="{% url 'login' %}">Sign in</a>.</p>
</div>
{% endblock %}
