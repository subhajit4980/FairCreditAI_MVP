{% extends "core/base.html" %}
{% block content %}
<div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
  <h1 style="margin:0;">Users</h1>
  <a class="btn" href="{% url 'admin_user_create' %}">+ New user</a>
</div>
<div class="card">
  <div class="table-wrap">
    <table>
    <thead><tr><th>Username</th><th>Email</th><th>Role</th><th>Active</th><th>Joined</th><th></th></tr></thead>
    <tbody>
      {% for u in users %}
        <tr>
          <td>{{ u.username }}</td>
          <td class="small">{{ u.email|default:"—" }}</td>
          <td><span class="badge info">{{ u.get_role_display }}</span></td>
          <td>{{ u.is_active|yesno:"Yes,No" }}</td>
          <td class="small">{{ u.date_joined|date:"d M Y" }}</td>
          <td><a class="btn small secondary" href="{% url 'admin_user_edit' u.id %}">Edit</a></td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
  </div>
</div>
{% endblock %}
